name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nfpm
        run: |
          ver=2.43.0
          arch="$(dpkg --print-architecture)"
          curl -sSL "https://github.com/goreleaser/nfpm/releases/download/v${ver}/nfpm_${ver}_${arch}.deb" -o /tmp/nfpm.deb
          sudo apt-get install -y /tmp/nfpm.deb

      - name: Build .deb
        run: make build
        env:
          # tag ref like v0.1.4; nfpm's semver schema strips the leading "v".
          VERSION: ${{ github.ref_name }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.deb \
            --title "${{ github.ref_name }}" \
            --generate-notes

      # hand the .deb `make build` wrote into dist/ to the apt job below; a flat
      # artifact means "every release" of the APT repo.
      - name: Upload the .deb for the APT repo
        uses: actions/upload-artifact@v4
        with:
          name: debs
          path: dist/*.deb
          if-no-files-found: error

  # publish to the APT repo. the .deb was attached to the GitHub release above;
  # the gh-action-debian-repo engine writes packages/linux-candy.json in
  # candy-tools/debian-repo and pushes it, which triggers that repo's publish.
  # authenticates as the candy-tools GitHub App (org variable APT_APP_ID +
  # secret APT_APP_PRIVATE_KEY), which mints a short-lived token scoped to
  # debian-repo.
  apt:
    needs: release
    permissions:
      contents: read
    uses: andresbott/gh-action-debian-repo/.github/workflows/publish.yml@v1.0.0-rc.2
    with:
      name: linux-candy           # must match the .deb's Package field
      artifact: debs
      collection: candy-tools/debian-repo
      app-id: ${{ vars.APT_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.APT_APP_PRIVATE_KEY }}
